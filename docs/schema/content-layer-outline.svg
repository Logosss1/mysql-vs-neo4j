<text x="210.0" y="503" font-size="28" font-weight="bold" text-anchor="middle">Concept</text>
<text x="210.0" y="536" font-size="21" font-weight="normal" text-anchor="middle">id, kind, label, definition</text>
<rect x="520" y="470" width="370" height="135" rx="18" fill="#EFE2EE" stroke="#96538B" stroke-width="2"/>
<text x="705.0" y="503" font-size="28" font-weight="bold" text-anchor="middle">KnowledgeAssertion</text>
<text x="705.0" y="536" font-size="21" font-weight="normal" text-anchor="middle">Source-based statement</text>
<text x="705.0" y="565" font-size="21" font-weight="normal" text-anchor="middle">context, review_status</text>
<rect x="1050" y="470" width="430" height="135" rx="18" fill="#DCEAF2" stroke="#4B819C" stroke-width="2"/>
<text x="1265.0" y="503" font-size="28" font-weight="bold" text-anchor="middle">EvidenceSpan</text>
<text x="1265.0" y="536" font-size="21" font-weight="normal" text-anchor="middle">Exact text, source_version</text>
<text x="1265.0" y="565" font-size="21" font-weight="normal" text-anchor="middle">PDF page / web paragraph / timestamp</text>
<text x="435.0" y="224" font-size="18" font-weight="normal" text-anchor="middle">HAS_CITATION</text>
<text x="935.0" y="224" font-size="18" font-weight="normal" text-anchor="middle">CITES</text>
<text x="1412.5" y="355" font-size="18" font-weight="normal" text-anchor="middle">HAS_EVIDENCE_SPAN</text>
<text x="970.0" y="522" font-size="18" font-weight="normal" text-anchor="middle">SUPPORTED_BY</text>
<text x="435.0" y="522" font-size="18" font-weight="normal" text-anchor="middle">USES_CONCEPT</text>
<text x="60" y="702" font-size="22" font-weight="normal" text-anchor="start">Candidate concept kinds: scam type, contact channel, manipulation, requested action, response action</text>
<text x="60" y="752" font-size="22" font-weight="normal" text-anchor="start">Reuse Topic IDs where definitions match. Keep the existing catalog classifications.</text>
<text x="60" y="802" font-size="22" font-weight="normal" text-anchor="start">Review history and extraction runs are the next design decisions.</text>
<text x="60" y="868" font-size="16" font-weight="normal" text-anchor="start">JCDL 2026: Chekuri &amp; Fox §§3–4; Chen et al. §3.1; Aboelnaga et al. §§3.2–4; Gordea &amp; Cotea §2</text>
