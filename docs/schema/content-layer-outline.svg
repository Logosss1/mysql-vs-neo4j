<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Proposed content layer for the anti-fraud library</title>
<desc id="desc">Catalog provenance connects to Resource. Resource has EvidenceSpan. KnowledgeAssertion is supported by EvidenceSpan and uses Concept. New records are a design proposal.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#595959"/></marker></defs>
