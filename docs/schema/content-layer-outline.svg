<text x="210.0" y="261" font-size="21" font-weight="normal" text-anchor="middle">Original resource list</text>
<rect x="520" y="195" width="270" height="90" rx="18" fill="#DCEAF2" stroke="#4B819C" stroke-width="2"/>
<text x="655.0" y="228" font-size="28" font-weight="bold" text-anchor="middle">Citation</text>
