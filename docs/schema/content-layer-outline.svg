<text x="40" y="100" font-size="24" font-weight="normal" text-anchor="start">Catalog records connect to source passages and reviewable statements</text>
<rect x="40" y="125" width="1510" height="195" fill="none" stroke="#9FBACA" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="60" y="159" font-size="23" font-weight="normal" text-anchor="start">Existing catalog in the v2 design</text>
